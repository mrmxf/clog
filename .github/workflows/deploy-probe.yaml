#
#  deploy-probe — callable workflow: publish the build, then ask the LIVE
#  target what it looks like from outside. Everything it produces lands in
#  _clog_deploy/ - receipts/ and probe/.
#
#  It replaces deploy-s3.yaml, whose name was always historical: the
#  destinations are ci.targets entries, of any kind. The probe is the new half,
#  and it is a different axis from the build-time scan - scan looks at things
#  that sit still (source, lockfiles, binaries), probe looks at things that are
#  live (a served site, a bucket, a pushed tag). It runs AFTER the deploy
#  because that is the only point at which its questions mean anything, and it
#  does not gate: the deploy has already happened, so failing here could not
#  un-publish it.
#
#  No secrets are passed in. clog-prepare decides from the caller's .clog.yaml
#  (ci.policy) whether this run deploys and in which mode (dev|prod); the
#  destinations are its ci.targets entries and the step runs once per target,
#  each with $CLOG_TARGET set. Secrets come from Infisical through
#  `clog CI run`, and `clog CI require deploy` (the target's require list
#  included) stops the job before any upload if one is missing.
#  Config: clog CI --config-help.
#
#  It does NOT rebuild: it downloads the artifact build-check uploaded, so the
#  bytes that passed the gates are the bytes that get published.
#
#  Caller:
#    jobs:
#      deploy:
#        needs: [build]
#        uses: mrmxf/clog/.github/workflows/deploy-probe.yaml@workflows
#        permissions: {contents: write, pages: read, id-token: write}
#          # contents: write  - a github-pages or github-release target pushes
#          # pages: read      - github-pages checks Pages serves the branch it
#          #                    pushes; without it that check only warns
#        with: {self-build: true}        # clog repos only
#
#  There is no permissions block below, on purpose. A reusable workflow's own
#  block can only NARROW what the caller grants, so the `contents: read` that
#  used to sit here cut every caller's write back to read, and no github-pages
#  or github-release target could publish (403). The caller grants what its
#  targets need: `contents: write` for GitHub targets, read for the rest, and
#  `pages: read` for github-pages.

name: deploy-probe
run-name: ${{ github.workflow }}(${{ github.event_name }}) 🥷${{ github.actor }}

on:
  workflow_call:
    inputs:
      self-build: { required: false, type: boolean, default: false }
      clog-ref:   { required: false, type: string,  default: "" }
      clog-repo:  { required: false, type: string,  default: "" }   # '' = get-clog.sh decides
      production: { required: false, type: boolean, default: false }  # build/deploy the newest release tag
    secrets:
      clog_download_token: { required: false }

concurrency:
  group: deploy-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  deploy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: prepare (checkout, go, clog, ci.policy)
        # ABSOLUTE on purpose - see build-check.yaml.
        uses: mrmxf/clog/.github/actions/clog-prepare@workflows
        with:
          self-build: ${{ inputs.self-build }}
          production: ${{ inputs.production }}
          clog-ref: ${{ inputs.clog-ref }}
          clog-repo: ${{ inputs.clog-repo }}
          token: ${{ secrets.clog_download_token }}

      - name: download artifact ${{ env.ci_artifact }} → _clog_build/
        if: env.do_deploy == 'true' && env.ci_artifact != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ env.ci_artifact }}
          path: .

      # One `clog CI deploy` per ci.targets entry for this mode (D-I.14). This
      # is the Go deployer, not a repo snippet: the target block is the whole
      # instruction, so a repo adds a destination by adding data.
      - name: deploy ${{ env.deploy_targets }} (one per target)
        if: env.do_deploy == 'true'
        # Actions does not put its token in the environment, and the GitHub
        # deployers (github-pages pushes, github-release runs gh) read it from
        # there. Without this, every GitHub target fails to authenticate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $deploy_targets; do
            echo "::group::deploy $t (${{ env.deploy_mode }})"
            CLOG_TARGET="$t" clog CI run -- bash -c '
              clog CI require deploy || exit 1
              clog CI deploy --target "$CLOG_TARGET"' || exit 1
            echo "::endgroup::"
          done

      # Probe what was just published. Never gates - see the header.
      - name: probe the live targets
        env:
          GH_TOKEN: ${{ github.token }}   # a release probe reads the assets with gh
        if: always() && env.do_deploy == 'true'
        run: clog CI probe || true

      - name: upload deploy receipts + probe findings
        if: always() && env.do_deploy == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: clog-deploy
          retention-days: 7
          path: _clog_deploy

      - name: notify-team (slack, HOOK_SLACK from Infisical)
        if: always() && env.do_deploy == 'true'
        env:
          MD: "• deploy ${{ env.deploy_mode }} ${{ env.ref }} by ${{ env.actor }}\n• ${{ env.url }}\n• run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
        run: |
          clog CI run -- bash -c '
            [ -z "${HOOK_SLACK:-}" ] && { clog Log -W "HOOK_SLACK not set - no Slack notify"; exit 0; }
            clog SlackStash "${ci_title:-deploy} ($deploy_mode)" --md "$MD"'
