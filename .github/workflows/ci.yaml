#  BSD-3-Clause License           https://opensource.org/license/bsd-3-clause/
#
#  ci — the two checks that must not depend on clog working.
#
#  self-build.yaml proves clog builds and gates itself. This file proves the
#  things that would still be wrong if clog were broken, so it uses plain Go
#  and plain actions only:
#
#    1. GOWORK=off go build/test   the pins in go.mod, not a local workspace
#    2. actionlint                 the workflow YAML in this repo
#
#  (1) exists because ~/gr/clogs/go.work puts util's working tree into the Go
#  workspace on the author's machine, so a local build uses util's SOURCE and
#  never exercises go.mod at all. A runner has no workspace. That masking
#  shipped a broken bc/buildinfo pin once already; this is the guard.

name: ci
run-name: ci(${{ github.event_name }}) 🥷${{ github.actor }}

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"     # build the way a runner does, not the way a laptop does
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # `go env GOWORK` reports "" when it found no workspace and "off" when
      # one is disabled. Both mean the pins in go.mod are what is being built.
      # Anything else is a PATH to a go.work, and that is the masking this job
      # exists to catch - so the test is "not a path", not "empty".
      - name: go env (prove no workspace is masking go.mod)
        run: |
          gw="$(go env GOWORK)"
          echo "GOWORK=[$gw]"
          case "$gw" in
            ""|off) echo "ok: go.mod pins are what is being built" ;;
            *) echo "::error::workspace $gw is active - go.mod pins are not being tested"; exit 1 ;;
          esac
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # SC2016 is excluded on purpose, and only SC2016. "Expressions don't
      # expand in single quotes" is the whole point of `clog CI run -- bash -c
      # '...$SECRET...'`: expansion has to happen in the INNER shell, the one
      # that has the Infisical secrets in its environment. Taking shellcheck's
      # advice here would expand those names in the outer shell, where they are
      # empty - turning every secret into a blank string. Every other check,
      # including the rest of shellcheck, still fails the build.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: "--exclude=SC2016"
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
