#
#  test-setup-clog — install a verified, runnable clog with NO clog-repo input.
#
#  That omission is the test. clog-repo defaults to '' everywhere except
#  get-clog.sh, so a green run proves the empty value really does pass through
#  to the one default rather than to a stale copy of it.
#
#  A plain workflow on purpose: it runs setup-clog from the WORKING TREE, so a
#  pull request editing the action is tested against its own edit. It was a
#  reusable workflow once, and no one called it; as one, its `uses: ./…` would
#  also have resolved against the caller's checkout.

name: test-setup-clog
run-name: test-setup-clog(${{ github.event_name }}) 🥷${{ github.actor }}

on:
  pull_request:
    paths:
      - ".github/actions/setup-clog/**"
      - ".github/workflows/test-setup-clog.yaml"
  workflow_dispatch:
    inputs:
      clog-ref:
        description: "clog release tag to install ('' = this repo's .clog-version)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test-setup-clog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: setup-clog (no clog-repo)
        id: setup
        uses: ./.github/actions/setup-clog
        with:
          clog-ref: ${{ inputs.clog-ref }}
      - name: verify clog runs, from the default repo
        shell: bash
        run: |
          clog --version
          echo "installed: ${{ steps.setup.outputs.version }}"
          case "${{ steps.setup.outputs.version }}" in
            *+basic*) ;;
            *) echo "::error::expected the +basic edition from mrmxf/clog"; exit 1 ;;
          esac
          echo "### clog bootstrap ✅ \`${{ steps.setup.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
